[package]
name = "videonarez"
version = "0.1.0"
description = "Лёгкий видео-нарезчик клипов и хайлайтов (Tauri v2 + FFmpeg)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
thiserror = "2"
base64 = "0.22"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
